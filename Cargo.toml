[package]
name = "proqbit"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
figment = { version = "0.10.19", features = ["toml"] }
notify = "8.2.0"
notify-rust = "4.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ureq = { version = "3.4.0", features = ["cookies", "json"] }

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"
strip = true
